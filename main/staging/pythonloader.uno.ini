[Bootstrap]
# Read by pyuno/source/loader/pyuno_loader.cxx CreateInstance() from
# $OOO_BASE_DIR/program/pythonloader.uno.ini (SAL_CONFIGFILE("pythonloader.uno")).
# Both keys MUST be set before Py_Initialize(); without them Python 2.7 finds no
# stdlib (no os.py/site.py), calls Py_FatalError and exit()s the whole soffice
# process the instant com.sun.star.loader.Python is instantiated.
#
# Equivalent of scp2/source/python/profileitem_python.scp (WNT, non-gcc branch).
# PYTHONPATH entries are space-separated file URLs; the loader converts each to a
# system path and joins them with ';'.  No lib-dynload / lib-tk on Windows.
PYUNO_LOADER_PYTHONHOME=$ORIGIN/python-core-2.7.18
PYUNO_LOADER_PYTHONPATH=$ORIGIN/python-core-2.7.18/lib $ORIGIN/python-core-2.7.18/lib/site-packages $ORIGIN
