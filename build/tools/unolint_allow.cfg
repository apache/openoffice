# uno_lint allowlist -- components registered in services.rdb whose artifact is
# knowingly absent from a default build.
#
# An entry here is a claim that the gap is INTENTIONAL and recorded elsewhere.
# It is not a way to silence a finding: the right fix is usually to gate the
# registration the same way the staging is gated, so services.rdb stops
# advertising a component that cannot load.
#
# Format:  <artifact>  # reason

# Conditionally staged behind //build:has_atl (see main/staging/BUILD.bazel).
# Registration is unconditional, so a non-ATL build advertises all three.
emser.dll               # ATL-gated: embedserv OLE server
winaccessibility.dll    # ATL-gated: accessibility bridge
oleautobridge.uno.dll   # ATL-gated: OLE automation bridge (extensions/readme.md)

# Deferred pending an external SDK.
ldapbe.dll              # needs LDAP SDK headers/libs (extensions/readme.md)

# Deferred pending the Java pipeline.
XSLTFilter.jar            # no Java pipeline yet (main/filter/BUILD.bazel:596, frontier.md:787)
java_uno_accessbridge.jar # Java Access Bridge deferred (accessibility/readme.md:30)

# Deliberately NOT allowlisted, because no record explains them:
#   avmediawin.dll  -- //main/avmedia:avmediawin builds, but staging installs
#                      only avmedia_res; main/avmedia/readme.md says it ships.
#   sysmail.dll     -- shell/source/win32/sysmail has no Bazel target at all.
# These two are the acceptance test for the graph: uno_lint must report exactly
# them and nothing else.
